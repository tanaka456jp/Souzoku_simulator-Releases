name: Migrate Souzoku Simulator v1.2.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      NOTE_KEY: nd90a984e8c01
      ASSET_NAME: Souzoku_Simulator_Ver1.2.0_Free.zip
      EXPECTED_SHA256: 7ef14728fc353aed0d51fbcdcb07f938edac775c2398f1d167ab44f5f032876b
      RELEASE_TAG: v1.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover exact ZIP from the public note attachment
        shell: python
        run: |
          import hashlib
          import html
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request

          note_key = os.environ['NOTE_KEY']
          asset_name = os.environ['ASSET_NAME']
          expected = os.environ['EXPECTED_SHA256'].lower()
          out_path = asset_name
          ua = 'Mozilla/5.0 (GitHub Actions; Souzoku release migration)'

          def get(url):
              req = urllib.request.Request(url, headers={
                  'User-Agent': ua,
                  'Accept': 'application/json,text/html,application/octet-stream;q=0.9,*/*;q=0.8',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), r.headers.get('Content-Type', ''), r.geturl()

          api_url = f'https://note.com/api/v3/notes/{note_key}'
          raw, _, _ = get(api_url)
          payload = json.loads(raw.decode('utf-8'))

          strings = []
          def walk(value):
              if isinstance(value, dict):
                  for v in value.values(): walk(v)
              elif isinstance(value, list):
                  for v in value: walk(v)
              elif isinstance(value, str):
                  strings.append(value)
          walk(payload)

          page_url = f'https://note.com/hip_shark7851/n/{note_key}'
          try:
              page_raw, _, _ = get(page_url)
              strings.append(page_raw.decode('utf-8', errors='replace'))
          except Exception as exc:
              print(f'Public page fetch warning: {exc}')

          candidates = []
          seen = set()
          url_re = re.compile(r"https?://[^\s\"'<>\\]+")
          href_re = re.compile(r"(?:href|url)[=:\s]+[\"']([^\"']+)", re.I)

          def add_candidate(url):
              url = html.unescape(url).replace('\\u0026', '&').replace('\\/', '/')
              if url.startswith('//'):
                  url = 'https:' + url
              if url.startswith('/'):
                  url = urllib.parse.urljoin('https://note.com/', url)
              if not url.startswith('http'):
                  return
              url = url.rstrip('),.;')
              if url not in seen:
                  seen.add(url)
                  candidates.append(url)

          for s in strings:
              decoded = html.unescape(s).replace('\\u0026', '&').replace('\\/', '/')
              for m in url_re.findall(decoded): add_candidate(m)
              for m in href_re.findall(decoded): add_candidate(m)

          ranked = sorted(
              candidates,
              key=lambda u: (
                  asset_name not in urllib.parse.unquote(u),
                  not any(k in u.lower() for k in ('download', 'file', 'assets', 'noteusercontent', 'cdn')),
                  len(u),
              )
          )

          print(f'Found {len(ranked)} candidate URLs in note API/page data.')
          matches = []
          for url in ranked:
              try:
                  body, content_type, final_url = get(url)
              except Exception:
                  continue
              digest = hashlib.sha256(body).hexdigest()
              if digest == expected:
                  matches.append((url, final_url, body))
                  print(f'Exact SHA-256 match: {final_url}')
                  break
              if asset_name in urllib.parse.unquote(url) or 'zip' in content_type.lower():
                  print(f'Candidate mismatch: {final_url} sha256={digest} bytes={len(body)} type={content_type}')

          if not matches:
              print('No exact SHA-256 matching download URL was recovered. Migration is blocked.')
              related = [s for s in strings if asset_name in s]
              print(f'Strings mentioning asset name: {len(related)}')
              for item in related[:10]:
                  print(item[:1000])
              sys.exit(1)

          body = matches[0][2]
          with open(out_path, 'wb') as f:
              f.write(body)
          print(f'Wrote {out_path}: {len(body)} bytes; sha256={expected}')

      - name: Re-verify exact asset digest
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "$ASSET_NAME" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "Verified $ASSET_NAME sha256=$actual"

      - name: Create or verify GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            tmp="$(mktemp -d)"
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$tmp" >/dev/null 2>&1; then
              current="$(sha256sum "$tmp/$ASSET_NAME" | awk '{print $1}')"
              if [ "$current" != "$EXPECTED_SHA256" ]; then
                echo "Existing release asset SHA mismatch; refusing replacement. actual=$current expected=$EXPECTED_SHA256" >&2
                exit 1
              fi
              echo "Existing release asset is already exact; no upload required."
            else
              gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" "$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Souzoku Simulator V1.2.0" \
              --notes "相続対策シミュレーター Ver1.2.0 の無料配布用Releaseです。note公開済みの検証済みZIP（SHA-256: $EXPECTED_SHA256）を同一バイナリのまま移行しています。"
          fi

      - name: Confirm release metadata and download count field
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == env.ASSET_NAME) | {name, size, digest, download_count, browser_download_url}'
