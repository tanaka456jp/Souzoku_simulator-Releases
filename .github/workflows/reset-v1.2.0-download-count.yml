name: Reset v1.2.0 migration verification count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reset-v1.2.0-download-count.yml'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      TAG: v1.2.0
      ASSET: Souzoku_Simulator_Ver1.2.0_Free.zip
      SHA256: 7ef14728fc353aed0d51fbcdcb07f938edac775c2398f1d167ab44f5f032876b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify current asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir verified
          actual="$(sha256sum "verified/$ASSET" | awk '{print $1}')"
          test "$actual" = "$SHA256"

      - name: Replace exact asset to reset migration-only count
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --yes
          gh release upload "$TAG" "verified/$ASSET" --repo "$GITHUB_REPOSITORY"
          meta="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == env.ASSET) | [.digest, (.download_count|tostring)] | @tsv')"
          digest="${meta%%$'\t'*}"
          count="${meta##*$'\t'}"
          test "$digest" = "sha256:$SHA256"
          test "$count" = "0"
          echo "Reset verified: digest=$digest download_count=$count"

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reset-v1.2.0-download-count.yml
          git commit -m 'chore: remove migration count reset workflow'
          git push origin HEAD:main
