name: Mirror v1.5 Update Asset

on:
  push:
    paths:
      - .github/workflows/mirror-v15-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify published v1.5 update asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updates
          curl -fL --retry 3 --retry-delay 2 \
            -o updates/Souzoku_Simulator_Ver1.5.0_Update.xlsm \
            "https://github.com/tanaka456jp/Souzoku_simulator-Releases/releases/download/v1.5.0/Souzoku_Simulator_Ver1.5.0_Update.xlsm"
          echo "a45a89ac6f9bfeee2a00414a9c223a9fd9b0fdc419c48d09704f13d63ee981c8  updates/Souzoku_Simulator_Ver1.5.0_Update.xlsm" | sha256sum -c -

      - name: Commit raw update mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/Souzoku_Simulator_Ver1.5.0_Update.xlsm
          if git diff --cached --quiet; then
            echo "Mirror already current."
            exit 0
          fi
          git commit -m "release: mirror v1.5 update asset for raw updater download"
          git push origin HEAD:main
